[mypy]
python_version = 3.13
# 第三方库按 Any 处理：
# - PySide6 6.11 自带 py.typed + .pyi 桩，始终参与类型检查（ignore_missing_imports 不影响它，
#   2026-08 整改后全仓 57 文件 0 错误，含 UI 层）；
# - docx / pptx / pymupdf 无桩 → 按 Any（使用被限制在 core/adapters 内，边界由端口收口）。
ignore_missing_imports = True
follow_imports = silent
disallow_any_unimported = False
warn_unused_ignores = False

# 启用 mypy strict 的核心检查项（除 disallow_any_unimported 外，因其要求第三方类型桩）
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_return_any = True
no_implicit_reexport = True
strict_equality = True
disallow_subclassing_any = True
